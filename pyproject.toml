[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "anthropic>=0.28",
    "structlog>=24.1",
    "langgraph>=0.1",
    "google-genai>=2.9.0",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
]
# openpyxl (Excel) + pdfplumber (PDF table extraction) added in Phase 3.

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "reportlab>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
